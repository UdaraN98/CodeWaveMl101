name: Model Training CI

on:
  push:
    branches:
      - main
      - week-5-test-mlops-pipeline
    paths:
      - 'Project/**'
      - '.github/workflows/model-training.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Project/**'
  workflow_dispatch:

jobs:
  train-model:
    # Use explicit labels — DO NOT use bare self-hosted
    runs-on: self-hosted

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT_NAME: "model-training-ci"
      MODEL_NAME: "my_model"
      GIT_SHA: ${{ github.sha }}
      GIT_REF: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DO NOT use setup-python on self-hosted macOS
      - name: Verify Python (system)
        run: |
          python3 --version
          which python3

      - name: Upgrade pip
        run: |
          python3 -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: ./Project
        run: |
          python3 -m pip install \
            "ipykernel>=7.1.0" \
            "kagglehub>=0.3.13" \
            "matplotlib>=3.10.7" \
            "mlflow>=3.8.0" \
            "optuna>=4.6.0" \
            "pandas>=2.3.3" \
            "scikit-learn>=1.8.0" \
            "seaborn>=0.13.2"

      - name: Verify git configuration
        run: |
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"
          git log -1 --pretty=format:"Commit: %H%nAuthor: %an%nDate: %ai%nMessage: %s"

      - name: Download training data if needed
        working-directory: ./Project
        run: |
          python3 ../.github/scripts/download_data.py

      - name: Run model training (logs to MLflow + S3)
        working-directory: ./Project
        run: |
          python3 Scripts/model_training.py

      - name: Training summary
        if: always()
        run: |
          echo "# Model Training Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** self-hosted (mlops)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Training completed. Check MLflow UI for metrics & registry." >> $GITHUB_STEP_SUMMARY

